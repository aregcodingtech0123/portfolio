name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium (+ OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright's OS deps only (browser already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      # The performance budget (scripts/perf/budget.json) reuses the production
      # build the e2e step just made (--skip-build) and starts its own server on
      # port 3200; it only ever talks to localhost. The bundle check is
      # deterministic and takes about a minute; the Lighthouse check is timing
      # based, so it runs a reduced matrix (see scripts/perf/README.md).
      - name: Performance budget, bundle size and public-chunk leak check
        run: npm run perf:budget -- --only bundle --skip-build
      - name: Performance budget, Lighthouse (reduced matrix)
        run: npm run perf:budget -- --only lighthouse --skip-build
