name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository. Nothing here pushes, comments or
# publishes, so the token gets no write scope (the default can be broader).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      # Report only: it never fails the build. Most findings are Sanity CLI,
      # ESLint and test tooling that never run on the host or reach a visitor
      # (docs/security/dependency-audit.md explains how to triage one), so a
      # blocking gate would just train people to ignore a red build. Read the
      # summary on the run page; a finding that is in the browser bundle or a
      # route's server trace is the kind to act on.
      - name: npm audit (report only, never fails)
        continue-on-error: true
        run: |
          npm audit --json > audit.json || true
          node scripts/audit-summary.mjs audit.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium (+ OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright's OS deps only (browser already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      # The performance budget (scripts/perf/budget.json) reuses the production
      # build the e2e step just made (--skip-build) and starts its own server on
      # port 3200; it only ever talks to localhost. The bundle check is
      # deterministic and takes about a minute; the Lighthouse check is timing
      # based, so it runs a reduced matrix (see scripts/perf/README.md).
      - name: Performance budget, bundle size and public-chunk leak check
        run: npm run perf:budget -- --only bundle --skip-build
      - name: Performance budget, Lighthouse (reduced matrix)
        run: npm run perf:budget -- --only lighthouse --skip-build
